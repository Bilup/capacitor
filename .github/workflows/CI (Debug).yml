name: CI (Debug)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_PLATFORM: 'android-35'

jobs:
  # ==================== 1. Build scratch-gui frontend ====================
  build-gui:
    name: build-gui
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      gui-built: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
        timeout-minutes: 5

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Fetch scratch-gui repository
        timeout-minutes: 15
        run: |
          if [ -d scratch-gui ]; then
            cd scratch-gui
            if ! git pull origin develop; then
              cd ..
              rm -rf scratch-gui
              git clone -b develop --single-branch --depth 1 https://github.com/Bilup/scratch-gui.git
            fi
          else
            git clone -b develop --single-branch --depth 1 https://github.com/Bilup/scratch-gui.git
          fi

      - name: Cache scratch-gui pnpm store
        uses: actions/cache@v4
        id: scratch-gui-cache
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-scratch-gui-${{ hashFiles('scratch-gui/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-scratch-gui-
        timeout-minutes: 5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
        timeout-minutes: 5

      - name: Install scratch-gui dependencies (if cache miss)
        if: steps.scratch-gui-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: cd scratch-gui && pnpm install

      - name: Build scratch-gui
        timeout-minutes: 20
        run: cd scratch-gui && pnpm run build

      - name: Sync Capacitor and copy web assets
        timeout-minutes: 10
        run: |
          npx cap copy
          npx cap sync android

      - name: Upload Android project
        uses: actions/upload-artifact@v4
        with:
          name: android-project
          path: android/
          retention-days: 1
        timeout-minutes: 5

  # ==================== 2. Build Debug APKs (3 version ranges x 2 flavors x 1-2 ABIs, all parallel) ====================
  # Matrix design:
  # - Android 7.0-9.0  (minSdk=24): x86 only (older devices, mostly 32-bit)
  # - Android 10-12    (minSdk=29): x86 + x86_64
  # - Android 13-16    (minSdk=33): x86 + x86_64
  # Each (range, flavor, abi) combination is an independent job
  build-apk:
    name: build-apk (${{ matrix.range }}, ${{ matrix.flavor }}, ${{ matrix.abi }})
    needs: build-gui
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------- Android 7.0-9.0: x86 only ----------
          - range: android-7-9
            minSdk: 24
            flavor: phone
            abi: x86
          - range: android-7-9
            minSdk: 24
            flavor: tablet
            abi: x86
          # ---------- Android 10-12: x86 + x86_64 ----------
          - range: android-10-12
            minSdk: 29
            flavor: phone
            abi: x86
          - range: android-10-12
            minSdk: 29
            flavor: phone
            abi: x86_64
          - range: android-10-12
            minSdk: 29
            flavor: tablet
            abi: x86
          - range: android-10-12
            minSdk: 29
            flavor: tablet
            abi: x86_64
          # ---------- Android 13-16: x86 + x86_64 ----------
          - range: android-13-16
            minSdk: 33
            flavor: phone
            abi: x86
          - range: android-13-16
            minSdk: 33
            flavor: phone
            abi: x86_64
          - range: android-13-16
            minSdk: 33
            flavor: tablet
            abi: x86
          - range: android-13-16
            minSdk: 33
            flavor: tablet
            abi: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
        timeout-minutes: 5

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
        timeout-minutes: 10

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;${{ env.ANDROID_BUILD_TOOLS }} platforms;${{ env.ANDROID_PLATFORM }}"
        timeout-minutes: 15

      - name: Add Android SDK to PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/${{ env.ANDROID_BUILD_TOOLS }}" >> $GITHUB_PATH
        timeout-minutes: 2

      - name: Download Android project
        uses: actions/download-artifact@v4
        with:
          name: android-project
          path: android/
        timeout-minutes: 5

      - name: Create local.properties for Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        timeout-minutes: 2

      - name: Cache Gradle wrapper and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
        timeout-minutes: 5

      - name: Build Debug APK
        env:
          FLAVOR: ${{ matrix.flavor }}
          MIN_SDK: ${{ matrix.minSdk }}
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.parallel=true -Dorg.gradle.jvmargs=-Xmx4g"
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          cd android
          chmod +x gradlew
          # Capitalize first letter of flavor (phone→Phone, tablet→Tablet)
          FLAVOR_CAP="$(echo "${FLAVOR:0:1}" | tr '[:lower:]' '[:upper:]')${FLAVOR:1}"
          GRADLE_CMD="assemble${FLAVOR_CAP}Debug"
          echo "============================================"
          echo "Building: $GRADLE_CMD (minSdk=$MIN_SDK)"
          echo "============================================"
          ./gradlew "$GRADLE_CMD" -PbilupMinSdk="$MIN_SDK" \
            --no-daemon --parallel --build-cache -x test -x lint \
            --console=plain --stacktrace
        timeout-minutes: 40

      - name: Stage APK by ABI
        env:
          FLAVOR: ${{ matrix.flavor }}
          ABI: ${{ matrix.abi }}
        run: |
          mkdir -p staged
          # Map ABI to the suffix used in build.gradle output naming
          if [ "$ABI" = "x86_64" ]; then
            ABI_PATTERN="*64.apk"
          elif [ "$ABI" = "x86" ]; then
            ABI_PATTERN="*x86.apk"
          else
            ABI_PATTERN="*.apk"
          fi
          cp android/app/build/outputs/apk/$FLAVOR/debug/$ABI_PATTERN staged/
          echo "Staged APK(s):"
          ls -la staged/
        timeout-minutes: 2

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Bilup-${{ matrix.range }}-${{ matrix.flavor }}-${{ matrix.abi }}
          path: staged/*.apk
          if-no-files-found: error
          retention-days: 14
        timeout-minutes: 5
