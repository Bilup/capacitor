name: CI (Debug)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      gui-built: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
        timeout-minutes: 5

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Fetch scratch-gui repository
        timeout-minutes: 15
        run: |
          if [ -d scratch-gui ]; then
            cd scratch-gui
            if ! git pull origin develop; then
              cd ..
              rm -rf scratch-gui
              git clone -b develop --single-branch --depth 1 https://github.com/Bilup/scratch-gui.git
            fi
          else
            git clone -b develop --single-branch --depth 1 https://github.com/Bilup/scratch-gui.git
          fi

      - name: Cache scratch-gui dependencies
        uses: actions/cache@v4
        id: scratch-gui-cache
        with:
          path: scratch-gui/node_modules
          key: ${{ runner.os }}-scratch-gui-${{ hashFiles('scratch-gui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-scratch-gui-
        timeout-minutes: 5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          cache: true
        timeout-minutes: 5

      - name: Install scratch-gui dependencies (if cache miss)
        if: steps.scratch-gui-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: cd scratch-gui && bun install

      - name: Build scratch-gui
        timeout-minutes: 20
        run: cd scratch-gui && bun run build

      - name: Sync Capacitor and copy web assets
        timeout-minutes: 10
        run: |
          npx cap copy
          npx cap sync android

      - name: Upload Android project
        uses: actions/upload-artifact@v4
        with:
          name: android-project
          path: android/
          retention-days: 1
        timeout-minutes: 5

  # --- build-apk is now split into 4 jobs ---

  build-phone-debug:
    needs: build-gui
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
        timeout-minutes: 5

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
        timeout-minutes: 10

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;35.0.0 platforms;android-35"
        timeout-minutes: 15

      - name: Add Android SDK to PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/35.0.0" >> $GITHUB_PATH
        timeout-minutes: 2

      - name: Download Android project
        uses: actions/download-artifact@v4
        with:
          name: android-project
          path: android/
        timeout-minutes: 5

      - name: Create local.properties for Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        timeout-minutes: 2

      - name: Cache Gradle wrapper and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
        timeout-minutes: 5

      - name: Build Phone Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assemblePhoneDebug --no-daemon --parallel --build-cache -x test -x lint --console=plain --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.parallel=true -Dorg.gradle.jvmargs=-Xmx4g"
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        timeout-minutes: 40

      - name: Copy and stage Phone APKs
        run: |
          mkdir -p staged-phone
          for apk in android/app/build/outputs/apk/phone/debug/*.apk; do
            filename=$(basename "$apk")
            cp "$apk" "staged-phone/$filename"
          done
        timeout-minutes: 2

      - name: Upload Phone APK (x86)
        uses: actions/upload-artifact@v4
        with:
          name: Bilup-android-phone-debug-x86
          path: staged-phone/*x86.apk
          retention-days: 14
        timeout-minutes: 5

      - name: Upload Phone APK (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: Bilup-android-phone-debug-x86_64
          path: staged-phone/*64.apk
          retention-days: 14
        timeout-minutes: 5

      - name: Upload Phone APK (all remaining - arm64)
        uses: actions/upload-artifact@v4
        if: hashFiles('staged-phone/*.apk') != ''
        with:
          name: Bilup-android-phone-debug-arm
          path: staged-phone/*.apk
          retention-days: 14
        timeout-minutes: 5

  build-tablet-debug:
    needs: build-gui
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
        timeout-minutes: 5

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
        timeout-minutes: 10

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;35.0.0 platforms;android-35"
        timeout-minutes: 15

      - name: Add Android SDK to PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/35.0.0" >> $GITHUB_PATH
        timeout-minutes: 2

      - name: Download Android project
        uses: actions/download-artifact@v4
        with:
          name: android-project
          path: android/
        timeout-minutes: 5

      - name: Create local.properties for Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        timeout-minutes: 2

      - name: Cache Gradle wrapper and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
        timeout-minutes: 5

      - name: Build Tablet Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleTabletDebug --no-daemon --parallel --build-cache -x test -x lint --console=plain --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.parallel=true -Dorg.gradle.jvmargs=-Xmx4g"
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        timeout-minutes: 40

      - name: Copy and stage Tablet APKs
        run: |
          mkdir -p staged-tablet
          for apk in android/app/build/outputs/apk/tablet/debug/*.apk; do
            filename=$(basename "$apk")
            cp "$apk" "staged-tablet/$filename"
          done
        timeout-minutes: 2

      - name: Upload Tablet APK (x86)
        uses: actions/upload-artifact@v4
        with:
          name: Bilup-android-tablet-debug-x86
          path: staged-tablet/*x86.apk
          retention-days: 14
        timeout-minutes: 5

      - name: Upload Tablet APK (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: Bilup-android-tablet-debug-x86_64
          path: staged-tablet/*64.apk
          retention-days: 14
        timeout-minutes: 5

      - name: Upload Tablet APK (all remaining - arm64)
        uses: actions/upload-artifact@v4
        if: hashFiles('staged-tablet/*.apk') != ''
        with:
          name: Bilup-android-tablet-debug-arm
          path: staged-tablet/*.apk
          retention-days: 14
        timeout-minutes: 5

  upload-debug-summary:
    needs: [build-phone-debug, build-tablet-debug]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()

    steps:
      - name: Summarize uploaded debug APKs
        run: |
          echo "## Debug APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Flavor | ABI | Artifact Name |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----|---------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Phone | x86 | Bilup-android-phone-debug-x86 |" >> $GITHUB_STEP_SUMMARY
          echo "| Phone | x86_64 | Bilup-android-phone-debug-x86_64 |" >> $GITHUB_STEP_SUMMARY
          echo "| Phone | arm64 | Bilup-android-phone-debug-arm |" >> $GITHUB_STEP_SUMMARY
          echo "| Tablet | x86 | Bilup-android-tablet-debug-x86 |" >> $GITHUB_STEP_SUMMARY
          echo "| Tablet | x86_64 | Bilup-android-tablet-debug-x86_64 |" >> $GITHUB_STEP_SUMMARY
          echo "| Tablet | arm64 | Bilup-android-tablet-debug-arm |" >> $GITHUB_STEP_SUMMARY
        timeout-minutes: 2
