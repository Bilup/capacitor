name: CI (Release)

# Only triggered on v* tag pushes or manual dispatch.
# Debug workflow (push/PR) does NOT run on tag pushes, so these two don't overlap.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_PLATFORM: 'android-35'

jobs:
  # ==================== 1. Build scratch-gui frontend ====================
  build-gui:
    name: build-gui
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      gui-built: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
        timeout-minutes: 5

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Fetch scratch-gui repository
        timeout-minutes: 15
        run: |
          if [ -d scratch-gui ]; then
            cd scratch-gui
            if ! git pull origin develop; then
              cd ..
              rm -rf scratch-gui
              git clone -b develop --single-branch --depth 1 https://github.com/Bilup/scratch-gui.git
            fi
          else
            git clone -b develop --single-branch --depth 1 https://github.com/Bilup/scratch-gui.git
          fi

      - name: Cache scratch-gui pnpm store
        uses: actions/cache@v4
        id: scratch-gui-cache
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-scratch-gui-${{ hashFiles('scratch-gui/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-scratch-gui-
        timeout-minutes: 5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
        timeout-minutes: 5

      - name: Install scratch-gui dependencies
        run: cd scratch-gui && pnpm install

      - name: Build scratch-gui
        timeout-minutes: 20
        run: cd scratch-gui && pnpm run build

      - name: Sync Capacitor and copy web assets
        timeout-minutes: 10
        run: |
          npx cap copy
          npx cap sync android

      - name: Upload Android project
        uses: actions/upload-artifact@v4
        with:
          name: android-project
          path: android/
          retention-days: 1
        timeout-minutes: 5

  # ==================== 2. Build Release APKs (3 version ranges x 1-2 ABIs, all parallel) ====================
  build-apk:
    name: build-apk (${{ matrix.range }}, ${{ matrix.abi }})
    needs: build-gui
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------- Android 7.0-9.0: x86 only ----------
          - range: android-7-9
            minSdk: 24
            abi: x86
          # ---------- Android 10-12: x86 + x86_64 ----------
          - range: android-10-12
            minSdk: 29
            abi: x86
          - range: android-10-12
            minSdk: 29
            abi: x86_64
          # ---------- Android 13-16: x86 + x86_64 ----------
          - range: android-13-16
            minSdk: 33
            abi: x86
          - range: android-13-16
            minSdk: 33
            abi: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
        timeout-minutes: 5

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
        timeout-minutes: 10

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;${{ env.ANDROID_BUILD_TOOLS }} platforms;${{ env.ANDROID_PLATFORM }}"
        timeout-minutes: 15

      - name: Add Android SDK to PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/${{ env.ANDROID_BUILD_TOOLS }}" >> $GITHUB_PATH
        timeout-minutes: 2

      - name: Download Android project
        uses: actions/download-artifact@v4
        with:
          name: android-project
          path: android/
        timeout-minutes: 5

      - name: Create local.properties for Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        timeout-minutes: 2

      - name: Cache Gradle wrapper and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
        timeout-minutes: 5

      - name: Restore fixed signing keystore
        run: |
          # 关键：必须使用仓库内固定的签名密钥（keystore_base64.txt），
          # 保证所有 Release APK 使用同一签名，用户才能通过覆盖安装升级。
          # 之前用 keytool -genkeypair 随机生成，导致每次发布签名都不同，
          # 用户升级安装时报 "签名不一致" 错误。
          rm -f android/app/release.keystore
          # 防御：若文件带 UTF-8 BOM，先去掉，否则 base64 -d 会报 invalid input
          sed -i '1s/^\xEF\xBB\xBF//' keystore_base64.txt
          base64 -d keystore_base64.txt > android/app/release.keystore
        timeout-minutes: 2

      - name: Build Release APK
        env:
          MIN_SDK: ${{ matrix.minSdk }}
          # 固定密钥信息来自仓库内 release.keystore（keystore_base64.txt 解码）：
          # alias=bilup, store/key 密码=bilup123（与 signing.gradle 默认值一致）。
          # 不再从 secrets 读取，避免与固定密钥不匹配导致签名失败或签名漂移。
          KEYSTORE_PASSWORD: bilup123
          KEY_ALIAS: bilup
          KEY_PASSWORD: bilup123
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.parallel=true -Dorg.gradle.jvmargs=-Xmx4g"
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          cd android
          chmod +x gradlew
          GRADLE_CMD="assembleDeviceRelease"
          echo "============================================"
          echo "Building: $GRADLE_CMD (minSdk=$MIN_SDK)"
          echo "============================================"
          ./gradlew "$GRADLE_CMD" -PbilupMinSdk="$MIN_SDK" \
            --no-daemon --parallel --build-cache -x test -x lint \
            --console=plain --stacktrace
        timeout-minutes: 40

      - name: Stage APK by ABI
        env:
          ABI: ${{ matrix.abi }}
        run: |
          mkdir -p staged
          if [ "$ABI" = "x86_64" ]; then
            ABI_PATTERN="*64.apk"
          elif [ "$ABI" = "x86" ]; then
            ABI_PATTERN="*x86.apk"
          else
            ABI_PATTERN="*.apk"
          fi
          cp android/app/build/outputs/apk/device/release/$ABI_PATTERN staged/
          echo "Staged APK(s):"
          ls -la staged/
        timeout-minutes: 2

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Bilup-${{ matrix.range }}-${{ matrix.abi }}
          path: staged/*.apk
          if-no-files-found: error
          retention-days: 30
        timeout-minutes: 5

  # ==================== 3. Publish to GitHub Release ====================
  publish-release:
    name: Publish to GitHub Release
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
        timeout-minutes: 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
        timeout-minutes: 5

      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: ./apks/
          pattern: Bilup-*
          merge-multiple: true
        timeout-minutes: 10

      - name: List APK files
        run: |
          echo "============================================"
          echo "APKs to be published to GitHub Release:"
          echo "============================================"
          find ./apks -name '*.apk' -type f -exec ls -lh {} \;
        timeout-minutes: 2

      - name: Upload to GitHub Releases
        run: |
          TAG_NAME="${{ github.ref_name }}"
          echo "Creating release: ${TAG_NAME}"
          find ./apks -name '*.apk' -type f -print0 | xargs -0 gh release create "${TAG_NAME}" \
            --title "${TAG_NAME}" \
            --notes "Automated release build

          | Version Range | Flavor | ABI |
          |---------------|--------|-----|
          | 7.0-9.0 (minSdk=24) | device | x86 |
          | 10-12 (minSdk=29) | device | x86, x86_64 |
          | 13-16 (minSdk=33) | device | x86, x86_64 |"
        env:
          GH_TOKEN: "${{ github.token }}"
        timeout-minutes: 10
