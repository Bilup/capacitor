apply plugin: 'com.android.application'
apply from: '../signing.gradle'

// Read version from version.json (with fallback for CI environments)
def appVersion = "1.6.1"
try {
    def versionFile = rootProject.file('scripts/version.json')
    if (versionFile.exists()) {
        def text = versionFile.text
        // Simple regex extraction to avoid JsonSlurper class resolution issues with AGP 8.x
        def match = text =~ /"version"\s*:\s*"([^"]+)"/
        if (match) {
            appVersion = match[0][1]
        }
        logger.lifecycle("Using version from scripts/version.json: ${appVersion}")
    } else {
        logger.warn("scripts/version.json not found, using default version: ${appVersion}")
    }
} catch(Exception e) {
    logger.warn("Could not read version.json, using default version: ${appVersion} - ${e.message}")
}

android {
    namespace = "org.bilup.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "org.bilup.app"
        // Support -PbilupMinSdk=N CLI prop to override minSdkVersion (CI builds by version range)
        minSdkVersion project.findProperty('bilupMinSdk')?.toInteger() ?: rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions "device"
    productFlavors {
        phone {
            dimension "device"
            applicationIdSuffix ".phone"
            versionNameSuffix "-phone"
            buildConfigField "String", "DEVICE_TYPE", "\"phone\""
        }
        tablet {
            dimension "device"
            applicationIdSuffix ".tablet"
            versionNameSuffix "-tablet"
            buildConfigField "String", "DEVICE_TYPE", "\"tablet\""
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'x86', 'x86_64'
            universalApk false
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            def abiSuffix = abi == 'x86_64' ? '64' : (abi == 'x86' ? 'x86' : '')
            def flavor = variant.flavorName
            def version = defaultConfig.versionName
            def buildType = variant.buildType.name
            output.outputFileName = "Bilup-android-${flavor}-${version}-${abiSuffix}.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
