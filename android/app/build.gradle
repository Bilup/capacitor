apply plugin: 'com.android.application'
apply from: '../signing.gradle'

// Read version from version.json (with fallback for CI environments)
def appVersion = "2.0.2"
try {
    def versionFile = rootProject.file('scripts/version.json')
    if (versionFile.exists()) {
        def text = versionFile.text
        // Simple regex extraction to avoid JsonSlurper class resolution issues with AGP 8.x
        def match = text =~ /"version"\s*:\s*"([^"]+)"/
        if (match) {
            appVersion = match[0][1]
        }
        logger.lifecycle("Using version from scripts/version.json: ${appVersion}")
    } else {
        logger.warn("scripts/version.json not found, using default version: ${appVersion}")
    }
} catch(Exception e) {
    logger.warn("Could not read version.json, using default version: ${appVersion} - ${e.message}")
}

android {
    namespace = "org.bilup.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "org.bilup.app"
        // Support -PbilupMinSdk=N CLI prop to override minSdkVersion (CI builds by version range)
        minSdkVersion project.findProperty('bilupMinSdk')?.toInteger() ?: rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            // 关键静态资源以未压缩形式打包进 APK：
            // Capacitor 本地服务器每次从 assets 读取文件，压缩存储的文件需先解压
            // （scratch-gui 的 JS/CSS bundle 达数 MB，解压开销明显），不压缩可显著
            // 加快编辑器与素材加载速度。代价是 APK 体积略增。
            noCompress 'js', 'mjs', 'css', 'html', 'json', 'wasm', 'svg', 'txt'
        }
    }
    flavorDimensions "device"
    productFlavors {
        device {
            dimension "device"
            buildConfigField "String", "DEVICE_TYPE", "\"device\""
        }
    }
    buildTypes {
        release {
            // 开启 R8 代码压缩 + 资源压缩：显著减小 APK 体积，
            // 老机器安装/加载更快、占用存储更少。Keep 规则见 proguard-rules.pro。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'x86', 'x86_64'
            universalApk false
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            def abiSuffix = abi == 'x86_64' ? '64' : (abi == 'x86' ? 'x86' : '')
            def flavor = variant.flavorName
            def version = defaultConfig.versionName
            def buildType = variant.buildType.name
            // CI 通过 -PbilupRange 传入版本范围（如 android-7-9），
            // 保证不同 matrix job 的 APK 文件名唯一，避免发布合并时同名覆盖
            // （否则 5 个 APK 会因同名互相覆盖，Release 上只剩 x86 / x86_64 两个）。
            def range = project.findProperty('bilupRange') ?: "sdk${defaultConfig.minSdkVersion}"
            output.outputFileName = "Bilup-android-${flavor}-${version}-${range}-${abiSuffix}.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
