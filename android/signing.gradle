android.signingConfigs {
    release {
        storeFile file('release.keystore')
        storePassword System.getenv("KEYSTORE_PASSWORD") ?: "bilup123"
        keyAlias System.getenv("KEY_ALIAS") ?: "bilup"
        keyPassword System.getenv("KEY_PASSWORD") ?: "bilup123"
        // 关键：AGP 8.x 默认 v1SigningEnabled=false，只生成 v2/v3 签名。
        // 但本应用 minSdk=24（Android 7.0），大量 Android 7-9 设备的
        // PackageInstaller / 第三方安装器只认 v1 签名，
        // 缺失 v1 会导致 "应用解析失败 / 应用未安装 (INSTALL_PARSE_FAILED)"。
        // 显式同时启用 v1/v2/v3，保证全版本设备都能解析安装。
        enableV1Signing true
        enableV2Signing true
        enableV3Signing true
    }
}
